services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_BACKEND_API: ${NEXT_PUBLIC_BACKEND_API:-https://api.casadilusso.ma}
        NEXT_PUBLIC_DOMAIN_URL_PREFIX: ${NEXT_PUBLIC_DOMAIN_URL_PREFIX:-https://casadilusso.ma}
    container_name: casa_di_lusso_frontend_web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_API: ${NEXT_PUBLIC_BACKEND_API:-https://api.casadilusso.ma}
      NEXT_PUBLIC_DOMAIN_URL_PREFIX: ${NEXT_PUBLIC_DOMAIN_URL_PREFIX:-https://casadilusso.ma}
    ports:
      - "3008:3008"
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3008/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  webnet:
    driver: bridge
